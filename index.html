<style>
/* Layout idea: one narrow column, a sticky search/filter bar on top, rows ordered by urgency (closing soon first, closed last). */
:root {
  --bg: #eef5fd;
  --surface: #ffffff;
  --ink: #0f1f3a;
  --muted: #51658a;
  --line: #d2e0f3;
  --accent: #1565d8;
  --accent-ink: #ffffff;
  --accent-soft: #e1edfc;
  --ok: #1b7f4b;
  --ok-soft: #e1f3e8;
  --warn: #9a5b00;
  --warn-soft: #fdeccd;
  --info: #6a43c0;
  --info-soft: #ece6fa;
  --closed: #5a6a85;
  --closed-soft: #e6ecf5;
  --cat-doc: #1565d8;   --cat-doc-soft: #e1edfc;
  --cat-grade: #c2410c; --cat-grade-soft: #fde8dc;
  --cat-sup: #0f7a6c;   --cat-sup-soft: #dcf3ef;
  --cat-work: #7a3fc4;  --cat-work-soft: #efe5fb;
  --cat-cal: #b42363;   --cat-cal-soft: #fbe3ee;
  --font-display: "Prompt", "Sarabun", system-ui, sans-serif;
  --font-body: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1626;
    --surface: #121f34;
    --ink: #e6eefb;
    --muted: #9db0d0;
    --line: #23364f;
    --accent: #6cadff;
    --accent-ink: #04162e;
    --accent-soft: #14294a;
    --ok: #66d195;
    --ok-soft: #153325;
    --warn: #f2b653;
    --warn-soft: #3a2b10;
    --info: #b8a0f6;
    --info-soft: #2a2147;
    --closed: #9db0d0;
    --closed-soft: #1d2d45;
    --cat-doc: #6cadff;   --cat-doc-soft: #14294a;
    --cat-grade: #ff9a62; --cat-grade-soft: #3a2014;
    --cat-sup: #4fd1bd;   --cat-sup-soft: #0f3330;
    --cat-work: #c3a0ff;  --cat-work-soft: #2a1f47;
    --cat-cal: #ff8ab8;   --cat-cal-soft: #3d1628;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1626;
  --surface: #121f34;
  --ink: #e6eefb;
  --muted: #9db0d0;
  --line: #23364f;
  --accent: #6cadff;
  --accent-ink: #04162e;
  --accent-soft: #14294a;
  --ok: #66d195;
  --ok-soft: #153325;
  --warn: #f2b653;
  --warn-soft: #3a2b10;
  --info: #b8a0f6;
  --info-soft: #2a2147;
  --closed: #9db0d0;
  --closed-soft: #1d2d45;
  --cat-doc: #6cadff;   --cat-doc-soft: #14294a;
  --cat-grade: #ff9a62; --cat-grade-soft: #3a2014;
  --cat-sup: #4fd1bd;   --cat-sup-soft: #0f3330;
  --cat-work: #c3a0ff;  --cat-work-soft: #2a1f47;
  --cat-cal: #ff8ab8;   --cat-cal-soft: #3d1628;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  border-top: 6px solid #f7b500;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 56px; padding-top: env(safe-area-inset-top); }

header { padding: 24px 0 14px; display: flex; align-items: center; gap: 16px; }
.school-logo { height: 72px; width: auto; flex: none; }
h1 {
  font-family: var(--font-display);
  color: var(--accent);
  font-weight: 600;
  font-size: 1.9rem;
  line-height: 1.25;
  margin: 0 0 4px;
  text-wrap: balance;
}
.sub { margin: 0; color: var(--muted); font-size: 0.95rem; }

.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: 10px 0 12px;
  border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 10px;
}
.search { position: relative; }
.search input {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
}
.search input::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 0.92rem;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 13px;
  cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center;
}
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.85; }
.chips.cats .chip { font-size: 0.88rem; padding: 2px 11px; }
.chips.cats .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.count { margin: 16px 0 8px; color: var(--muted); font-size: 0.92rem; }
.group-title {
  font-family: var(--font-display); font-weight: 500;
  font-size: 1.1rem; margin: 28px 0 4px;
}
.group-note { margin: 0 0 8px; color: var(--muted); font-size: 0.92rem; }

ul.list {
  list-style: none; margin: 0; padding: 0;
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.tile { position: relative; }
.tile > a, .tile > .tile-off {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
  padding: 16px 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--ink); text-decoration: none;
}
.tile > a:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgba(21,101,216,.12); }
.tile.s-open > a { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.tile.s-soon > a { border-color: var(--warn); border-width: 2px; padding: 15px 9px 11px; }
.tile.s-upcoming > a { border-color: color-mix(in srgb, var(--info) 45%, var(--line)); }
.tile > .tile-off { cursor: not-allowed; opacity: .62; }
.tile > .tile-off .ico { filter: grayscale(1); }
.ico {
  width: 56px; height: 56px; border-radius: 16px; flex: none;
  display: grid; place-items: center;
  background: var(--c-soft, var(--accent-soft)); color: var(--c, var(--accent));
}
.ico svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.c-doc   { --c: var(--cat-doc);   --c-soft: var(--cat-doc-soft); }
.c-grade { --c: var(--cat-grade); --c-soft: var(--cat-grade-soft); }
.c-sup   { --c: var(--cat-sup);   --c-soft: var(--cat-sup-soft); }
.c-work  { --c: var(--cat-work);  --c-soft: var(--cat-work-soft); }
.c-cal   { --c: var(--cat-cal);   --c-soft: var(--cat-cal-soft); }
.title {
  font-weight: 700; font-size: 0.95rem; line-height: 1.35; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.sub2 { font-size: 0.78rem; color: var(--muted); line-height: 1.35; font-variant-numeric: tabular-nums; }
.pill {
  position: absolute; top: 6px; right: 6px;
  border-radius: 999px; padding: 0 8px; font-size: 0.74rem; font-weight: 700; line-height: 1.6;
}
.pill.open { background: var(--ok-soft); color: var(--ok); }
.pill.soon { background: var(--warn-soft); color: var(--warn); }
.pill.upcoming { background: var(--info-soft); color: var(--info); }
.pill.closed { background: var(--closed-soft); color: var(--closed); }
.note { margin: 0; font-size: 0.76rem; color: var(--muted); line-height: 1.35; }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
footer { margin-top: 36px; font-size: 0.85rem; color: var(--muted); }

@media (max-width: 560px) {
  h1 { font-size: 1.55rem; }
  ul.list { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tile > a, .chip, .search input { transition: background-color .15s, border-color .15s, color .15s; }
}
</style>
</head>

function typeOf(url) {

  if (/forms\.gle|docs\.google\.com\/forms/.test(url)) return "Google Form";

  if (/script\.google\.com/.test(url)) return "Apps Script";
  if (/appsheet\.com/.test(url)) return "AppSheet";
  if (/\.pdf($|\?)/.test(url)) return "PDF";
  return "เว็บระบบ";
}

function statusOf(it, now) {
  var s = it.start && parseISO(it.start), e = it.end && parseISO(it.end);
  if (e && now > e) return { key: "closed", label: "ปิดแล้ว", rank: 4 };
  if (s && now < s) {
    var ds = Math.round((s - now) / DAY);
    return { key: "upcoming", label: "เริ่มใน " + ds + " วัน", rank: 2 };
  }
  if (e) {
    var d = Math.round((e - now) / DAY);
    if (d <= 7) return { key: "soon", label: d === 0 ? "ปิดวันนี้" : "ปิดใน " + d + " วัน", rank: 0 };
    return { key: "open", label: "เปิดรับ", rank: 1 };
  }
  return { key: "none", label: "", rank: 3 };
}

function parseCSV(text) {
  var rows = [], row = [], cell = "", q = false, i, c;
  text = text.replace(/^﻿/, "");
  for (i = 0; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = ""; rows.push(row); row = [];
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

var TH_DATE_RE = new RegExp("(\\d{1,2})\\s*(" + TH_MONTH_ALT.join("|") + ")\\s*(\\d{4})?", "g");

function iso(y, m, d) {
  if (y > 2400) y -= 543;
  var dt = new Date(y, m, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m || dt.getDate() !== d) return null;
  return y + "-" + ("0" + (m + 1)).slice(-2) + "-" + ("0" + d).slice(-2);
}

function parseDates(str) {
  var out = [], m;
  str = String(str || "").replace(/\s+/g, " ");
  TH_DATE_RE.lastIndex = 0;
  while ((m = TH_DATE_RE.exec(str))) out.push({ d: +m[1], m: TH_MONTH_MAP[m[2]], y: m[3] ? +m[3] : null });
  var re2 = /(\d{1,2})\/(\d{1,2})\/(\d{4})/g;
  while ((m = re2.exec(str))) out.push({ d: +m[1], m: +m[2] - 1, y: +m[3] });
  for (var i = out.length - 2; i >= 0; i--) if (out[i].y == null) out[i].y = out[i + 1].y;
  var thisYear = new Date().getFullYear();
  return out.map(function (x) { return iso(x.y == null ? thisYear : x.y, x.m, x.d); }).filter(Boolean);
}

function sheetToLinks(rows) {
  var head = (rows[0] || []).map(function (h) { return String(h).trim(); });
  function col(name, fallback) { var i = head.indexOf(name); return i >= 0 ? i : fallback; }
  var cNo = col("ที่", 0), cTitle = col("รายการ", 1), cUrl = col("ลิงก์", 2),

  var out = [];
  rows.slice(1).forEach(function (r) {
    var url = String(r[cUrl] || "").trim();
    var title = String(r[cTitle] || "").replace(/\s+/g, " ").replace(/["“”]/g, "").trim();
    if (!title || !/^https?:\/\//i.test(url)) return;   // skip blank rows and any non-web link
    var note = String(r[cNote] || "").replace(/\s+/g, " ").trim();
    // A first-time password must not be shown on the page.

    out.push(it);
  });
  return out;
}

function fetchCSV(url) {
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 12000) : null;
  return fetch(url + "&_=" + Date.now(), { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (text) {
      if (timer) clearTimeout(timer);
      if (/^\s*</.test(text)) throw new Error("not csv");   // sign-in page instead of data
      var links = sheetToLinks(parseCSV(text));
      if (!links.length) throw new Error("empty");
      return links;
    }, function (err) { if (timer) clearTimeout(timer); throw err; });
}

  })();
}

};
function iconFor(it, type) {
  var key = (it.cat === "cal" && /ปฏิทิน/.test(it.title)) ? "ปฏิทิน" : type;
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true");
  var path = document.createElementNS(ns, "path");
  path.setAttribute("d", ICONS[key] || ICONS["เว็บระบบ"]);
  svg.appendChild(path);
  var box = el("span", "ico" + (CAT_BASE[it.cat] ? " c-" + it.cat : ""));
  box.appendChild(svg);
  return box;
}
var CAT_BASE = { doc: 1, grade: 1, sup: 1, work: 1, cal: 1 };

function shortDate(s) { var d = parseISO(s); return d.getDate() + " " + MONTHS[d.getMonth()] + " " + String(d.getFullYear() + 543).slice(-2); }
function dateLine(it) {
  if (it.start && it.end) return shortDate(it.start) + " – " + shortDate(it.end);
  if (it.end) return "ปิดรับ " + shortDate(it.end);
  if (it.start) return "เริ่ม " + shortDate(it.start);
  return "";
}

function buildRow(o) {
  var it = o.it, st = o.st;
  var li = el("li", "tile" + (st.key !== "none" ? " s-" + st.key : ""));
  var closed = st.key === "closed";
  var box;
  if (closed) {
    box = el("div", "tile-off");
    box.setAttribute("role", "link"); box.setAttribute("aria-disabled", "true");
    box.setAttribute("aria-label", it.title + " ปิดรับข้อมูลแล้ว ไม่สามารถเปิดลิงก์ได้");
  } else {
    box = el("a");
    box.href = it.url; box.target = "_blank"; box.rel = "noopener noreferrer";
    box.setAttribute("aria-label", "เปิดลิงก์ " + it.title + (st.label ? " (" + st.label + ")" : ""));
  }
  box.title = it.title + " · " + o.type + (o.catName ? " · " + o.catName : "");
  box.appendChild(iconFor(it, o.type));
  box.appendChild(el("h3", "title", it.title));
  var dl = dateLine(it);
  if (dl) box.appendChild(el("span", "sub2", dl));
  if (it.note) box.appendChild(el("p", "note", it.note));
  li.appendChild(box);
  if (st.label) li.appendChild(el("span", "pill " + st.key, st.label));
  return li;
}

function matches(o) {
  if (state.cat !== "all" && o.it.cat !== state.cat) return false;
  if (state.status === "active" && o.st.key === "closed") return false;
  if (state.status === "soon" && o.st.key !== "soon") return false;
  if (state.status === "closed" && o.st.key !== "closed") return false;
  if (state.q) {
    var hay = (o.it.title + " " + o.catName + " " + o.type).toLowerCase();
    if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
  }
  return true;
}

function render() {
  var list = document.getElementById("list");
  list.textContent = "";
  var shown = ITEMS.filter(matches).sort(function (a, b) {
    return a.st.rank - b.st.rank || a.it.n - b.it.n;
  });
  shown.forEach(function (o) { list.appendChild(buildRow(o)); });
  if (!shown.length) {
    var li = el("li", "empty", "ไม่พบรายการที่ตรงกับคำค้น ลองล้างตัวกรองหรือพิมพ์คำอื่น");
    list.appendChild(li);
  }
  document.getElementById("count").textContent = "แสดง " + shown.length + " จาก " + ITEMS.length + " รายการ";
  renderChips();
}

function chip(label, n, pressed, onclick) {
  var b = el("button", "chip");
  b.type = "button";
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.appendChild(document.createTextNode(label));
  if (n != null) b.appendChild(el("span", "n", String(n)));
  b.addEventListener("click", onclick);
  return b;
}

function countBy(fn) { return ITEMS.filter(fn).length; }

function renderChips() {
  var sc = document.getElementById("statusChips");
  sc.textContent = "";
  [
    ["all", "ทั้งหมด", ITEMS.length],
    ["active", "ยังใช้งานได้", countBy(function (o) { return o.st.key !== "closed"; })],
    ["soon", "ใกล้ปิด", countBy(function (o) { return o.st.key === "soon"; })],
    ["closed", "ปิดรับแล้ว", countBy(function (o) { return o.st.key === "closed"; })]
  ].forEach(function (s) {
    sc.appendChild(chip(s[1], s[2], state.status === s[0], function () { state.status = s[0]; render(); }));
  });

  var cc = document.getElementById("catChips");
  cc.textContent = "";
  cc.appendChild(chip("ทุกหมวด", null, state.cat === "all", function () { state.cat = "all"; render(); }));
  Object.keys(CAT).filter(function (k) { return ITEMS.some(function (o) { return o.it.cat === k; }); }).forEach(function (k) {
    cc.appendChild(chip(CAT[k], null, state.cat === k, function () { state.cat = k; render(); }));
  });
}

function renderChecks() {
  var ul = document.getElementById("checkList");
  CHECKS.forEach(function (c) {
    ul.appendChild(buildRow({ it: c, st: { key: "none", label: "" }, type: typeOf(c.url), catName: "" }));
  });
}

document.getElementById("asof").textContent = "รวมลิงก์งานวิชาการ โรงเรียนบ้านหมี่วิทยา · ข้อมูล ณ วันที่ " + thai(
  now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate()
);
document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value.trim(); render(); });
buildItems(initialLinks());
render();
renderChecks();
loadSheet();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  });
}
</script>
</body>
</html>
